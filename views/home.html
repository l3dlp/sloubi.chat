<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Sloubi.chat · Fonde ta taverne</title>
    <meta name="description" content="Tape le nom de ta taverne, et compte les sloubis avec tes compagnons.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a0f08">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sloubi">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <link rel="preload" href="/assets/fonts/uncialantiqua-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/medievalsharp-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/home.css">
</head>
<body data-prefill="{{.Prefill}}">
    <div class="fx fx-emerald" aria-hidden="true"></div>
    <div class="fx fx-lava" aria-hidden="true"></div>
    <div class="fx fx-scanlines" aria-hidden="true"></div>

    <main class="home">
        <header class="brand">
            <div class="brand-name">Sloubi.chat</div>
            <div class="brand-tag">Fonde ta taverne. Compte les sloubis.</div>
        </header>

        <form class="prompt" id="prompt" autocomplete="off" novalidate>
            <label class="prompt-line" for="chanInput">
                <span class="prompt-slash" aria-hidden="true">/</span>
                <span class="prompt-field">
                    <span class="prompt-mirror" id="chanMirror" aria-hidden="true"></span>
                    <input id="chanInput" class="prompt-input" type="text" name="chan"
                           maxlength="32" spellcheck="false" autocapitalize="none" autocorrect="off"
                           enterkeyhint="go" inputmode="url" placeholder="________"
                           aria-describedby="chanHint" aria-label="Nom de ta taverne">
                </span>
                <span class="prompt-cursor" id="chanCursor" aria-hidden="true"></span>
            </label>
            <p class="prompt-hint" id="chanHint" aria-live="polite">Tape le nom de ta taverne</p>
            <p class="prompt-rule">lettres, chiffres, et un seul <code>.</code> <code>_</code> <code>-</code> à la fois</p>
        </form>

        <nav class="elsewhere" aria-label="Tavernes">
            <a href="/chante" class="elsewhere-main">ou rejoins la taverne historique <strong>/chante</strong></a>
            <div class="recent" id="recent" hidden>
                <span>Tes tavernes :</span>
            </div>
        </nav>

        <footer class="home-foot">
            <a href="https://github.com/l3dlp/sloubi.chat">Le code est sur GitHub</a>
        </footer>
    </main>

    <script src="/assets/home.js" type="module"></script>
</body>
</html>
