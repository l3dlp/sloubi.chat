<!DOCTYPE html>
<html lang="fr">
<head>
    <title>/{{.Chan}} · Sloubi.chat</title>
    <meta name="description" content="Une taverne enfumée où l'on compte les sloubis.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#140b07">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sloubi">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <link rel="preload" href="/assets/fonts/uncialantiqua-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/cormorantgaramond-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="/assets/vendor/three/three.module.js">
    <link rel="modulepreload" href="/assets/vendor/three/three.core.js">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/room.css">
</head>
<body class="room" data-chan="{{.Chan}}">
    <canvas id="smoke" class="smoke" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>

    <div class="room-shell">
        <header class="room-bar">
            <a href="/" class="room-mark" aria-label="Sloubi.chat, changer de taverne">Sloubi<span>.chat</span></a>

            <div class="room-chan">
                <span class="room-chan-label">Taverne</span>
                <span class="room-chan-name">/{{.Chan}}</span>
                <button id="copyLink" class="icon-btn" type="button" aria-label="Copier le lien de la taverne">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6M10.5 6.5l1.8-1.8a4.2 4.2 0 0 1 6 6l-1.8 1.8M13.5 17.5l-1.8 1.8a4.2 4.2 0 0 1-6-6l1.8-1.8"/></svg>
                </button>
            </div>

            <button id="settingsButton" class="icon-btn room-gear" type="button" aria-label="Paramètres">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
            </button>
        </header>

        <section class="counter" aria-label="Sloubis comptés">
            <div class="counter-label">sloubis comptés</div>
            <div class="counter-value" id="sloubiCount" aria-live="polite">0</div>
        </section>

        <main class="room-chat">
            <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Conversation">
                <div class="system-message">La fumée s'écarte. Bienvenue, voyageur.</div>
            </div>
        </main>

        <div class="room-bottom">
            <div id="cheatButton" class="cheat-button" hidden>
                <button id="quickSloubi" class="quick-sloubi-btn" type="button">✦ Sloubi rapide</button>
            </div>
            <div class="whisper">
                <input type="text" id="chatInput" class="whisper-input"
                       placeholder="Écrivez « sloubi 1 » pour compter..." maxlength="500"
                       autocomplete="off" aria-label="Votre message">
                <button id="sendButton" class="whisper-send" type="button" aria-label="Envoyer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </div>
    </div>

    <section id="postit" class="postit" aria-label="Parchemin de la taverne" hidden>
        <div class="postit-head" id="postitHandle" tabindex="0" title="Déplacer (flèches au clavier)">
            <span class="postit-title">Parchemin</span>
            <button id="postitClose" class="postit-close" type="button" aria-label="Refermer le parchemin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <textarea id="postitText" class="postit-text" maxlength="280" placeholder="Une note pour toute la taverne…" aria-label="Texte du parchemin"></textarea>
        <div class="postit-foot"><span id="postitCount">0</span>/280</div>
    </section>
    <button id="postitPin" class="postit-pin" type="button" aria-label="Ouvrir le parchemin" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M8 4v5l-3 4h14l-3-4V4M12 13v7"/></svg>
    </button>

    <div id="settingsModal" class="settings-modal">
        <div class="settings-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <div class="settings-header">
                <h2 id="settingsTitle">Paramètres</h2>
                <button id="closeSettings" class="icon-btn" type="button" aria-label="Fermer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="settings-body">
                <label class="setting-item">
                    <span class="setting-label">Pseudonyme</span>
                    <input type="text" id="nicknameInput" class="nickname-input" placeholder="Votre nom" maxlength="24">
                </label>
                <div class="setting-item" id="pwaInstallSection" hidden>
                    <span class="setting-label">Installer l'application</span>
                    <button id="installButton" class="install-button" type="button">Installer</button>
                </div>
                <label class="setting-item">
                    <span class="setting-label">Mode Triche</span>
                    <span class="toggle-switch">
                        <input type="checkbox" id="cheatModeToggle">
                        <span class="toggle-slider"></span>
                    </span>
                </label>
                <a href="https://github.com/l3dlp/sloubi.chat" class="setting-item setting-link">Le code est sur GitHub ↗</a>
            </div>
        </div>
    </div>

    <script src="/assets/app.js" type="module"></script>
    <script src="/assets/room-fx.js" type="module"></script>
</body>
</html>
