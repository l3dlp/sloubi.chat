# Durcissement du service sloubi : à installer en drop-in systemd
#   install -D -m 644 deploy/hardening.conf /etc/systemd/system/sloubi.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart sloubi
[Service]
User=www-data
Group=www-data

# lecture seule partout, sauf la base
ProtectSystem=strict
ReadWritePaths=/intelligences/apps/sloubi.chat/db
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
UMask=0027

# aucun privilège, aucune capacité (le port 8888 n'en demande pas)
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=

# noyau et système hors d'atteinte
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources

# garde-fous ressources
LimitNOFILE=16384
TasksMax=512
MemoryMax=512M
