# Relais TURN des appels (lieux gardés) : le coturn de BeamCam, même serveur.
# Sloubi lit le secret dans le fichier de BeamCam : rien à recopier, une seule source.
# Il tourne sous www-data, comme beamcam-peerjs, et ProtectSystem=strict laisse la lecture.
#   install -D -m 644 deploy/turn.conf /etc/systemd/system/sloubi.service.d/turn.conf
#   systemctl daemon-reload && systemctl restart sloubi
# Sans ce fichier, les appels passent en STUN seul (ça marche, sauf derrière les NAT stricts).
[Service]
Environment=TURN_SECRET_FILE=/intelligences/apps/beamcam.live/dev/server/.turn-secret
Environment=TURN_HOST=beamcam.live
Environment=TURN_PORT=3478
